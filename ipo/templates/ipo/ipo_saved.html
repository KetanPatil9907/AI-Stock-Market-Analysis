{% extends "base.html" %}

{% block title %}IPO Analysis Saved | AI Finance Assistant{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="auth-card card border-0 shadow-lg text-center">
                    <div class="card-body p-4 p-md-5">
                        <div class="auth-icon mb-3">
                            <i class="bi bi-bookmark-check-fill"></i>
                        </div>

                        <h1 class="h3 fw-bold">
                            IPO Analysis Saved
                        </h1>

                        <p class="text-muted mb-4">
                            Your educational analysis for
                            <strong>{{ analysis.ipo.company_name }}</strong>
                            has been saved successfully.
                        </p>

                        <a
                            class="btn btn-finance"
                            href="{% url 'ipo:detail' analysis.ipo.slug %}"
                        >
                            View IPO Details
                        </a>

                        <a
                            class="btn btn-outline-secondary ms-2"
                            href="{% url 'ipo:center' %}"
                        >
                            IPO Center
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
